<div class="container mt-4">
  <h1>Admin Dashboard</h1>

  @if (data$ | async; as data) {

<div class="dashboard-container">
  <section class="stats-grid">
    <div class="stat-card blue">
      <p>Total Doctors:</p>
      <h3>{{ data.doctors }}</h3>
    </div>

    <div class="stat-card blue">
      <p>Total Patients:</p>
      <h3>{{ data.patients }}</h3>
    </div>

    <div class="stat-card blue">
      <p>Total Appointments:</p>
      <h3>{{ data.appointments }}</h3>
    </div>

  </section>

</div>
  }
   @else {
    <p>Loading data...</p>
  }
