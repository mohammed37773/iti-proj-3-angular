<div class="page-center" *ngIf="UserProfile && !loading">

  <!-- 👁️ VIEW MODE -->
  <form *ngIf="!isEditMode" class="register-form white colm">

    <h1 class="colorize verdana mb-4">Your Profile</h1>

    <img [src]="UserProfile.avatar || 'https://i.pravatar.cc/150'" 
         class="doctor-avatar" />

    <div class="form-grid">

      <div class="form-group">
        <label>Full Name</label>
        <input [value]="UserProfile.name" class="form-input" disabled>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input [value]="UserProfile.email" class="form-input" disabled>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input [value]="UserProfile.phone" class="form-input" disabled>
      </div>

    </div>

    <button type="button" class="btn-submit" (click)="openEdit()">
      Edit
    </button>

  </form>

  <!-- ✏️ EDIT MODE -->
  <form *ngIf="isEditMode" class="register-form white colm">

    <h1 class="colorize verdana mb-4">Edit Profile</h1>

    <img [src]="editModel.avatar || 'https://i.pravatar.cc/150'" 
         class="doctor-avatar" />

    <div class="form-grid">

      <div class="form-group">
        <label>Full Name</label>
        <input [(ngModel)]="editModel.name" name="name" class="form-input">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input [(ngModel)]="editModel.email" name="email" class="form-input">
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input [(ngModel)]="editModel.phone" name="phone" class="form-input">
      </div>

    </div>

    <div class="actions">
      <button type="button" class="btn-submit" (click)="saveUpdate()">Save</button>
      <button type="button" class="btn-cancel" (click)="cancelEdit()">Cancel</button>
    </div>

  </form>

</div>

<!-- ⏳ Loading -->
<div *ngIf="loading" class="loading">
  Loading...
</div>
